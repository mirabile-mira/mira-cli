name: '🏷️ PR Contribution Guidelines Notifier'

on:
  pull_request:
    types:
      - 'opened'

jobs:
  notify-process-change:
    runs-on: 'ubuntu-latest'
    if: |-
      github.repository == 'Stewie-pixel/mirabile'
    permissions:
      pull-requests: 'write'
    steps:
      - name: 'Generate GitHub App Token'
        id: 'generate_token'
        env:
          APP_ID: '${{ secrets.APP_ID }}'
        if: |-
          ${{ env.APP_ID != '' }}
        uses: 'actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ secrets.APP_ID }}'
          private-key: '${{ secrets.PRIVATE_KEY }}'

      - name: 'Check membership and post comment'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          github-token: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          script: |-
            const org = context.repo.owner;
            const repo = context.repo.repo;
            const username = context.payload.pull_request.user.login;
            const pr_number = context.payload.pull_request.number;

            // 1. Check if the user is a member of the organization
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: org,
                username: username
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`User @${username} is not a member of the organization. No notification needed.`);
                return;
              } else {
                throw error; // Re-throw unexpected errors
              }
            }
              
            // 2. Check if the PR is already associated with an issue
            const query = `
              query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;
            const variables = { owner: org, repo: repo, number: pr_number };
            const result = await github.graphql(query, variables);
            const issueCount = result.repository.pullRequest.closingIssuesReferences.totalCount;

            if (issueCount > 0) {
              core.info(`PR #${pr_number} is already associated with an issue. No notification needed.`);
              return;
            }

            // 3. Post the notification comment
            core.info(`PR #${pr_number} is not associated with an issue. Posting notification.`);

            const comment = `
            Hi @${username}, thank you so much for your contribution to Mirabile! We really appreciate the time and effort you've put into this.

            We're making some updates to our contribution process to improve how we track and review changes. Please take a moment to review our recent discussion post: [Improving Our Contribution Process & Introducing New Guidelines].

            Key Update: Starting **March 26, 2026**, the Mirabile project will require all pull requests to be associated with an existing issue. Any pull requests not linked to an issue by that date will be automatically closed.

            Thank you for your understanding and for being a part of our community!
            `.trim().replace(/^[ ]+/gm, '');

            await github.rest.issues.createComment({
              owner: org,
              repo: repo,
              issue_number: pr_number,
              body: comment
            });