name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: run claude via openrouter
  
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_BODY: "${{ github.event.comment.body }}"

        run: |
          echo "Sending prompt to OpenRouter..."

          # Get Claude response from OpenRouter
          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -d "{
              \"model\": \"qwen/qwen3.6-plus:free\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"User said: $COMMENT_BODY\n\nRespond helpfully.\"
                }
              ]
            }")

          # Extract text response from OpenRouter output
          TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          echo "Claude response:"
          echo "$TEXT"

          # Post response as a GitHub comment
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$TEXT\"}" \
            https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments
          