name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  GH_TOKEN: ${{ github.token }}
  OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}

# Prevent multiple review runs on rapid PR updates
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Check Workflow Kill Switch
        run: |
          if [ -f ".github/WORKFLOW_KILLSWITCH" ]; then
            STATUS=$(grep "STATUS:" .github/WORKFLOW_KILLSWITCH | awk '{print $2}')
            if [ "$STATUS" = "DISABLED" ]; then
              echo "Workflows disabled by kill switch"
              exit 0
            fi
          fi

      - name: Check for Review Bypass
        id: bypass
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_LABELS="${{ toJSON(github.event.pull_request.labels.*.name) }}"

          if echo "$PR_TITLE" | grep -qE '\[EMERGENCY\]|\[SKIP REVIEW\]|\[HOTFIX\]'; then
            echo "bypass=true" >> $GITHUB_OUTPUT
            echo "reason=PR title contains bypass marker" >> $GITHUB_OUTPUT
            exit 0
          fi

          if echo "$PR_LABELS" | grep -qE 'emergency|skip-review|hotfix'; then
            echo "bypass=true" >> $GITHUB_OUTPUT
            echo "reason=PR has bypass label" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "bypass=false" >> $GITHUB_OUTPUT

      - name: Post Bypass Notice
        if: steps.bypass.outputs.bypass == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Code Review Bypassed

              **Reason**: ${{ steps.bypass.outputs.reason }}

              Manual review recommended.

              ---`
            })

      - name: Checkout repository
        if: steps.bypass.outputs.bypass != 'true'
        uses: actions/checkout@v4

      - name: Get PR diff
        run: |
          # Downloads the diff for the current pull request
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.patch

      - name: Send to OpenRouter
        id: review
        run: |
          PROMPT=$(cat pr_diff.patch | head -c 8000)
          [ -z "$PROMPT" ] && PROMPT="No changes detected in this PR."

          RESPONSE=$(curl -sS \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"qwen/qwen3.6-plus:free\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a senior code reviewer.\"},
                {\"role\": \"user\", \"content\": \"Review this PR diff:\\n$PROMPT\"}
              ]
            }")

          TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Review failed."')

          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"${{ steps.review.outputs.review }}\"}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments

      - name: Post fallback review note
        if: steps.review.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Automated Review Skipped

              The automated review could not complete.

              Please review manually.`
            })